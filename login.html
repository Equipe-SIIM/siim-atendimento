<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIIM Atendimento | Acesso seguro</title>
<style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#edf4ff;background:#0b1220}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 10%,#173659 0,transparent 38%),#0b1220}.wrap{width:min(100%,460px)}.brand{font-size:30px;font-weight:850;letter-spacing:.03em;margin-bottom:26px}.brand span{color:#69b2ff}.card{background:#142238;border:1px solid #304662;border-radius:20px;padding:32px;box-shadow:0 24px 65px #0005}h1{font-size:25px;margin:0 0 10px}p{color:#a9bdd6;line-height:1.5;margin:0 0 22px}label{display:block;color:#c9d8ea;font-size:14px;margin:18px 0 7px}input{width:100%;background:#0e1b2f;border:1px solid #49617e;border-radius:10px;color:#fff;padding:14px;font-size:16px}button{font:inherit;cursor:pointer}.primary{width:100%;border:0;border-radius:10px;background:#368cf1;color:#fff;padding:14px;font-weight:750;margin-top:23px}.primary:disabled{opacity:.55;cursor:wait}.links{display:flex;justify-content:space-between;gap:12px;margin-top:19px;flex-wrap:wrap}.link{border:0;background:none;color:#91c7ff;padding:0}.message{display:none;margin-top:20px;border-radius:10px;padding:12px;line-height:1.5;background:#203b59;color:#d4e9ff}.message.error{background:#462632;color:#ffd7dc}.small{font-size:12px;color:#91a8c4;margin-top:20px}.hidden{display:none!important}</style></head><body>
<div class="wrap"><div class="brand">SIIM <span>ATENDIMENTO</span></div><main class="card"><h1 id="title">Entrar no SIIM</h1><p id="desc">Acesso reservado aos colaboradores autorizados.</p>
<form id="form"><div id="emailRow"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required placeholder="seuemail@exemplo.com"></div><div id="passwordRow"><label for="password" id="passwordLabel">Senha</label><input id="password" type="password" autocomplete="current-password" minlength="8" required></div><button class="primary" id="submit" type="submit">Entrar</button></form>
<div class="links"><button class="link" id="forgot" type="button">Criar ou recuperar senha</button><button class="link hidden" id="back" type="button">Voltar ao login</button></div><div id="message" class="message" role="status" aria-live="polite"></div><div class="small">Ambiente real de autenticação. A demonstração permanece separada.</div></main></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.86.0/+esm';
const sb=createClient('https://seydpcxbteizouxhljor.supabase.co','sb_publishable_LBD8IJNOHp4DZjYdFId-Dw_a792Tc2q',{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);let mode='login';const redirect='https://equipe-siim.github.io/siim-atendimento/login.html';
function notice(msg,error=false){$('message').textContent=msg;$('message').className='message'+(error?' error':'');$('message').style.display='block'}
function setMode(next){mode=next;$('message').style.display='none';$('emailRow').classList.toggle('hidden',next==='set');$('passwordRow').classList.toggle('hidden',next==='recover');$('password').required=next!=='recover';$('password').autocomplete=next==='set'?'new-password':'current-password';$('title').textContent=next==='recover'?'Recuperar acesso':next==='set'?'Definir nova senha':'Entrar no SIIM';$('desc').textContent=next==='recover'?'Enviaremos um link para seu e-mail confirmado.':next==='set'?'Escolha uma senha de pelo menos 8 caracteres.':'Acesso reservado aos colaboradores autorizados.';$('submit').textContent=next==='recover'?'Enviar link de recuperação':next==='set'?'Salvar nova senha':'Entrar';$('forgot').classList.toggle('hidden',next!=='login');$('back').classList.toggle('hidden',next==='login')}
$('forgot').onclick=()=>setMode('recover');$('back').onclick=()=>setMode('login');
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{let error;if(mode==='recover'){({error}=await sb.auth.resetPasswordForEmail($('email').value.trim(),{redirectTo:redirect}));if(!error)notice('Se este e-mail estiver cadastrado, você receberá um link de recuperação. Confira também o spam.')}else if(mode==='set'){({error}=await sb.auth.updateUser({password:$('password').value}));if(!error){notice('Senha definida. Agora você pode entrar.');await sb.auth.signOut();history.replaceState(null,'',location.pathname);setTimeout(()=>setMode('login'),1600)}}else{const res=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});error=res.error;if(!error){const profile=await sb.from('siim_profiles').select('role,active,display_name').eq('user_id',res.data.user.id).maybeSingle();if(profile.error||!profile.data?.active){await sb.auth.signOut();notice('Sua conta não possui um perfil ativo autorizado no SIIM.',true)}else{notice('Autenticação confirmada para '+(profile.data.display_name||res.data.user.email)+' ('+profile.data.role+'). A integração dos módulos operacionais será liberada nas próximas etapas.')}}}if(error)notice(error.message||'Não foi possível concluir a operação.',true)}catch(err){notice('Erro de conexão. Tente novamente.',true);console.error(err)}finally{$('submit').disabled=false}};
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')setMode('set')});
if(location.hash.includes('type=recovery'))setMode('set');
if(new URLSearchParams(location.search).has('error'))notice('O link de autenticação expirou ou é inválido. Solicite um novo link.',true);
</script></body></html>
