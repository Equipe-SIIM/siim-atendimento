<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIIM | Cobranças</title><script src="siim-menu.js?v=3"></script><style>*{box-sizing:border-box}body{margin:0;background:#080e20;color:#e9efff;font:15px system-ui,sans-serif}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{background:#111d3c;padding:24px 14px;border-right:1px solid #294686}nav{display:grid;gap:8px}nav a{padding:14px;border-radius:10px;color:#a1b3d9;text-decoration:none}nav a.active{background:#306aff;color:white}main{padding:28px;min-width:0}section{background:#111d3c;border:1px solid #294686;border-radius:18px;padding:24px;margin-bottom:20px}button,input,select,textarea{font:inherit;border-radius:10px;padding:12px;max-width:100%}select,textarea{display:block;width:100%;background:#080e20;color:#e9efff;border:1px solid #294686;margin:8px 0 16px}button{background:#306aff;color:white;border:0;cursor:pointer}article{border-bottom:1px solid #294686;padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}@media(max-width:750px){.shell{grid-template-columns:1fr}main{padding:14px}}</style></head><body><div class="shell"><aside><h2>SIIM Atendimento</h2><p id="role"></p><nav class="siim-nav"></nav><p><button id="logout">Sair da plataforma</button></p></aside><main><h1>Cobranças internas</h1><p id="status" role="status">Validando acesso...</p><section id="compose" hidden><h2>Nova cobrança</h2><form id="form"><label>Destinatário<select id="recipient" required></select></label><label>Mensagem<textarea id="body" maxlength="4000" required></textarea></label><button>Enviar cobrança</button></form></section><section id="history" hidden><h2>Histórico</h2><button id="refresh">Atualizar</button><div id="items"></div></section></main></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.86.0/+esm';const sb=createClient('https://seydpcxbteizouxhljor.supabase.co','sb_publishable_LBD8IJNOHp4DZjYdFId-Dw_a792Tc2q'),$=id=>document.getElementById(id);let uid;async function load(){const {data,error}=await sb.from('siim_cobrancas').select('id,sender_id,recipient_id,body,created_at').order('created_at',{ascending:false}).limit(200);if(error)throw error;$('items').replaceChildren();for(const r of data){const el=document.createElement('article');el.textContent=(r.sender_id===uid?'Enviada':'Recebida')+' · '+new Date(r.created_at).toLocaleString('pt-BR')+'\n'+r.body;$('items').append(el)}if(!data.length)$('items').textContent='Nenhuma cobrança registrada.'}async function init(){const {data:{user}}=await sb.auth.getUser();if(!user){location.replace('login.html');return}uid=user.id;const {data:p,error}=await sb.from('siim_profiles').select('role,active').eq('user_id',uid).maybeSingle();if(error||!p?.active||!['DIRETOR','GESTOR','SUPERVISOR','AUXILIAR'].includes(p.role))throw Error('Acesso restrito');$('role').textContent=p.role;window.siimMenu(p.role);$('history').hidden=false;const {data:d,error:e}=await sb.rpc('siim_cobranca_destinos');if(e)throw e;if(d.length){for(const x of d){const o=document.createElement('option');o.value=x.user_id;o.textContent=x.display_name;$('recipient').append(o)}$('compose').hidden=false}await load();$('status').textContent=''}$('form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const {error}=await sb.rpc('siim_cobranca_enviar',{p_recipient:$('recipient').value,p_body:$('body').value});if(error)throw error;$('body').value='';await load();$('status').textContent='Cobrança enviada.'}catch(e){$('status').textContent=e.message}finally{b.disabled=false}};$('refresh').onclick=()=>load().catch(e=>$('status').textContent=e.message);$('logout').onclick=async()=>{await sb.auth.signOut();location.replace('login.html')};init().catch(e=>$('status').textContent=e.message);</script></body></html>
