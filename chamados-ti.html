<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIIM | Chamados à TI</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#0a1322;color:#eaf2ff}*{box-sizing:border-box}body{margin:0}header{padding:17px 24px;background:#101c30;border-bottom:1px solid #2d4563;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}header strong{font-size:21px}header strong span{color:#6db3ff}.user-chip{font-size:12px;border:1px solid #416181;background:#1b304b;border-radius:999px;padding:8px 12px;color:#dcecff;font-weight:700}header a{text-decoration:none}a{color:#8ec7ff}main{max-width:1000px;margin:auto;padding:25px 18px}h1{font-size:25px}.card{background:#15243a;border:1px solid #304966;border-radius:12px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:6px;font-size:13px}input,select,textarea{background:#0c1b2d;border:1px solid #466080;color:white;padding:10px;border-radius:7px;width:100%;font:inherit}textarea{min-height:80px}button{background:#307ee0;color:white;border:0;border-radius:7px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.5}.muted{color:#a9bed7;font-size:13px}.ticket{border-top:1px solid #304966;padding:12px 0}.ticket strong{display:block}.ticket .ticket-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}.ticket .ticket-actions button{margin:0}.ticket>.ticket-thread-button{display:inline-block;margin-top:12px}.thread{padding:12px;margin-top:10px;border:1px solid #466080;border-radius:8px;background:#0c1b2d}.thread p{padding:8px 0;border-bottom:1px solid #304966}.thread textarea{margin:8px 0}.ticket small{color:#a9bed7}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hidden{display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><strong>SIIM <span>CHAMADOS TI</span></strong><nav class="row"><span id="loggedUser" class="user-chip" aria-label="Usuário conectado">Identificando usuário...</span><a href="central.html">Atendimento</a><span>·</span><a href="admin.html">Administração</a></nav></header><main><h1>Central de Chamados à TI</h1><p id="status" class="muted">Validando acesso...</p><section id="supportCard" class="card hidden"><h2>Novo chamado de suporte</h2><form id="supportForm"><div class="grid"><label>Categoria<select name="category"><option value="SISTEMA">Sistema</option><option value="ACESSO">Acesso</option><option value="AUTOMACAO">Automação</option><option value="INTEGRACAO">Integração</option><option value="EQUIPAMENTO">Equipamento</option><option value="OUTROS">Outros</option></select></label><label>Prioridade<select name="priority"><option value="NORMAL">Normal</option><option value="BAIXA">Baixa</option><option value="ALTA">Alta</option><option value="CRITICA">Crítica</option></select></label></div><label style="margin:12px 0">Motivo do chamado (título)<input name="subject" minlength="5" required></label><label style="margin:12px 0">Justificativa — descreva o que precisa<textarea name="description" minlength="10" required></textarea></label><button type="submit">Abrir chamado</button></form></section><section id="requestCard" class="card hidden"><h2>Alteração de usuário — solicitação do gestor</h2><form id="requestForm"><div class="grid"><label>Ação<select name="action" required><option value="CRIAR">Criar usuário</option><option value="PAUSAR">Pausar usuário</option><option value="REATIVAR">Reativar usuário</option><option value="EXCLUIR">Excluir acesso (lógico)</option></select></label><label>Nome do colaborador<input name="name" required minlength="2"></label><label>E-mail<input name="email" type="email"></label><label>ID do usuário existente (para pausa/reativação/exclusão)<select id="target" name="target"><option value="">Selecionar usuário</option></select></label></div><label style="margin:12px 0">Justificativa<textarea name="justification" minlength="10" required></textarea></label><button type="submit">Abrir chamado</button></form></section><section class="card"><div class="row" style="justify-content:space-between"><h2>Chamados</h2><button id="refresh">Atualizar</button></div><div id="tickets" class="muted">Carregando...</div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.86.0/+esm';const sb=createClient('https://seydpcxbteizouxhljor.supabase.co','sb_publishable_LBD8IJNOHp4DZjYdFId-Dw_a792Tc2q'),$=id=>document.getElementById(id);let role='';async function init(){const {data:{user}}=await sb.auth.getUser();if(!user){location.replace('login.html');return}const {data:p}=await sb.from('siim_profiles').select('role,active').eq('user_id',user.id).maybeSingle();if(!p?.active||!['TI','ADMIN_GLOBAL','GESTOR_OPERACAO'].includes(p.role)){$('status').textContent='Acesso não autorizado.';return}role=p.role;const {data:identity}=await sb.from('siim_profiles').select('display_name').eq('user_id',user.id).maybeSingle();$('loggedUser').textContent=((identity?.display_name||user.email||'Usuário')+' — '+role).toUpperCase();$('status').textContent=role==='TI'?'Fila de solicitações para análise da TI.':'Solicitações registradas com histórico permanente.';if(role!=='TI'){$('supportCard').classList.remove('hidden');if(false){$('requestCard').classList.remove('hidden');const {data:users}=await sb.from('siim_profiles').select('user_id,display_name').eq('active',true).order('display_name');for(const p of users||[]){const o=document.createElement('option');o.value=p.user_id;o.textContent=p.display_name;$('target').append(o)}}}await load()}async function load(){const {data,error}=await sb.rpc('siim_list_user_requests');if(error){$('tickets').textContent=error.message;return}const list=$('tickets');list.replaceChildren();if(!data?.length){list.textContent='Nenhum chamado registrado.';return}for(const t of data){const el=document.createElement('div');el.className='ticket';const title=document.createElement('strong');title.textContent='#'+String(t.ticket_number||'—').padStart(6,'0')+' · '+(t.action==='SUPORTE'?(t.subject||'Suporte')+' · '+t.category:t.action+' · '+t.target_name);const info=document.createElement('small');info.textContent='Acompanhamento: '+({'ABERTO':'Aberto — aguardando TI','EM_ANALISE':'Em análise pela TI','AGUARDANDO_APOIO':'Aguardando Administrador Global','EM_CORRECAO':'Em correção','RESOLVIDO':'Resolvido — aguardando conclusão','EXECUTADO':'Concluído','RECUSADO':'Recusado','CANCELADO':'Cancelado'}[t.status]||t.status)+' · Prioridade: '+(t.priority||'NORMAL')+' · '+new Date(t.created_at).toLocaleString('pt-BR');const reason=document.createElement('p');reason.textContent=t.justification;const track=document.createElement('div');track.className='muted';track.textContent='Aberto em '+new Date(t.created_at).toLocaleString('pt-BR')+' · Atualizado em '+new Date(t.updated_at).toLocaleString('pt-BR');el.append(title,info,reason,track);const toggle=document.createElement('button');toggle.textContent='Conversar / Ver histórico';toggle.onclick=async()=>{let box=el.querySelector('.thread');if(box){box.remove();return}box=document.createElement('div');box.className='thread';el.append(box);async function show(){const {data,error}=await sb.rpc('siim_ticket_messages_list',{p_ticket:t.id});box.replaceChildren();if(error){box.textContent=error.message;return}for(const m of data||[]){const p=document.createElement('p');p.textContent=m.author_name+' ('+new Date(m.created_at).toLocaleString('pt-BR')+'): '+m.body;box.append(p)}if(!data?.length){const p=document.createElement('p');p.textContent='Sem mensagens ainda.';box.append(p)}if(['CANCELADO','RECUSADO','EXECUTADO'].includes(t.status))return;const form=document.createElement('form'),input=document.createElement('textarea'),btn=document.createElement('button');input.required=true;input.maxLength=5000;input.placeholder='Escreva uma mensagem...';btn.textContent='Enviar resposta';form.append(input,btn);form.onsubmit=async e=>{e.preventDefault();btn.disabled=true;const {error}=await sb.rpc('siim_ticket_message_send',{p_ticket:t.id,p_body:input.value});if(error){$('status').textContent=error.message;btn.disabled=false;return}await show()};box.append(form)}await show()};el.append(toggle);if(['TI','ADMIN_GLOBAL'].includes(role)&&!['EXECUTADO','RECUSADO','CANCELADO'].includes(t.status)){const actions=document.createElement('div');actions.className='ticket-actions';const options=role==='TI'?([['ABERTO','INICIAR','Iniciar atendimento'],['EM_ANALISE','ESCALAR','Solicitar apoio ao Administrador Global'],['EM_ANALISE','RESOLVER','Marcar como resolvido'],['EM_CORRECAO','ESCALAR','Solicitar apoio ao Administrador Global'],['EM_CORRECAO','RESOLVER','Marcar como resolvido'],['RESOLVIDO','CONCLUIR','Concluir chamado']]):([['AGUARDANDO_APOIO','ASSUMIR','Assumir chamado'],['EM_CORRECAO','RESOLVER','Marcar como resolvido'],['RESOLVIDO','CONCLUIR','Concluir chamado']]);for(const [from,action,label] of options.filter(o=>o[0]===t.status)){const btn=document.createElement('button');btn.textContent=label;btn.onclick=async()=>{const notes=prompt(action==='ESCALAR'?'Explique por que precisa de apoio (mínimo 10 caracteres):':action==='RESOLVER'?'Descreva a solução aplicada (mínimo 10 caracteres):':'Observação para o histórico (opcional):');if(notes===null)return;const {error}=await sb.rpc('siim_ticket_transition',{p_ticket:t.id,p_action:action,p_note:notes});$('status').textContent=error?error.message:'Chamado atualizado.';await load()};actions.append(btn)}el.append(actions)}list.append(el)}}$('supportForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.rpc('siim_create_support_ticket',{p_category:f.get('category'),p_subject:f.get('subject'),p_description:f.get('description'),p_priority:f.get('priority')});$('status').textContent=error?error.message:'Chamado registrado.';if(!error){e.target.reset();await load()}};$('requestForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),action=f.get('action'),target=f.get('target');if(action!=='CRIAR'&&!target){$('status').textContent='Selecione o usuário existente.';return}const {error}=await sb.rpc('siim_create_user_request',{p_action:action,p_name:f.get('name'),p_email:f.get('email'),p_justification:f.get('justification'),p_target:target||null});$('status').textContent=error?error.message:'Chamado registrado com sucesso.';if(!error){e.target.reset();await load()}};$('refresh').onclick=load;init();</script></body></html>
